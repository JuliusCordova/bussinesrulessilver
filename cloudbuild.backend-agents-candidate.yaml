substitutions:
  _REGION: us-central1
  _SERVICE: silver-refinement-agent-merge-test
  _REPOSITORY: dataops
  _IMAGE_NAME: silver-refinement-agent

steps:
  - id: backend-tests
    name: python:3.11-slim
    dir: backend/deployable/silver-refinement-agent
    entrypoint: bash
    args:
      - -ceu
      - |
        python -m pip install --no-cache-dir -r requirements-test.txt
        python -m compileall -q modules tests
        python -m pytest -q \
          tests/test_silver_agents.py \
          tests/test_result_validator.py \
          tests/test_finops_telemetry.py \
          tests/test_finops_api.py

  - id: build-candidate
    name: gcr.io/cloud-builders/docker
    dir: backend/deployable/silver-refinement-agent
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_IMAGE_NAME}:agents-8.2.0-${BUILD_ID}
      - .

  - id: push-candidate
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_IMAGE_NAME}:agents-8.2.0-${BUILD_ID}

  - id: deploy-test-service
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --project=${PROJECT_ID}
      - --region=${_REGION}
      - --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_IMAGE_NAME}:agents-8.2.0-${BUILD_ID}
      - --platform=managed
      - --quiet

  - id: smoke-health-cors-agents-finops
    name: python:3.11-slim
    entrypoint: python
    args:
      - -c
      - |
        import json
        import time
        import urllib.error
        import urllib.request

        base = "https://silver-refinement-agent-merge-test-mkqutd4koq-uc.a.run.app"

        def request(path, method="GET", payload=None, headers=None, timeout=300):
            body = None if payload is None else json.dumps(payload).encode()
            req = urllib.request.Request(
                base + path,
                data=body,
                method=method,
                headers={"Content-Type": "application/json", **(headers or {})},
            )
            with urllib.request.urlopen(req, timeout=timeout) as response:
                return response.status, dict(response.headers), response.read().decode()

        status, _, body = request("/health")
        health = json.loads(body)
        assert status == 200, body
        assert health["status"] == "ok", health
        assert health["version"] == "8.2.0", health

        status, headers, _ = request(
            "/silver-agents",
            method="OPTIONS",
            headers={
                "Origin": "https://business-rules-silver-ui-mkqutd4koq-uc.a.run.app",
                "Access-Control-Request-Method": "GET",
            },
        )
        assert status == 200, status
        assert headers.get("access-control-allow-origin") == "*", headers

        status, _, body = request("/silver-agents")
        agents = json.loads(body)
        assert status == 200, body
        assert {item["name"] for item in agents} == {
            "table-profiler",
            "mapping-advisor",
            "quality-rule-advisor",
            "business-rule-validator",
            "notebook-generator",
            "orchestrator",
        }, agents

        status, _, body = request("/agentops/governance/summary")
        governance = json.loads(body)
        assert status == 200, body
        for field in (
            "total_runs", "active_agents", "completed", "failed",
            "runs_today", "avg_duration_ms",
        ):
            assert field in governance, governance

        status, _, body = request("/agentops/governance/runs?limit=5")
        governed_runs = json.loads(body)
        assert status == 200, body
        assert isinstance(governed_runs.get("runs"), list), governed_runs

        status, _, body = request("/openapi.json")
        openapi = json.loads(body)
        assert status == 200, body
        artifact_download_path = (
            "/silver-refinement/specs/{spec_id}/artifacts/current/"
            "{artifact_type}/download"
        )
        assert artifact_download_path in openapi.get("paths", {}), openapi.get("paths", {})
        for finops_path in (
            "/agentops/finops/summary",
            "/agentops/finops/daily",
            "/agentops/finops/agents",
            "/agentops/finops/runs",
            "/agentops/finops/services",
        ):
            assert finops_path in openapi.get("paths", {}), finops_path

        profile_request = {
            "project_id": "proyectopersonal-480420",
            "source_dataset": "seguros_bronce",
            "source_table": "pagos_primas",
            "target_project_id": "proyectopersonal-480420",
            "target_dataset": "seguros_silver",
            "target_table": "pagos_primas",
            "columns": [],
            "load_strategy": {"type": "FULL", "business_keys": []},
            "physical_design": {},
            "business_keys": [],
            "watermark_column": "bronze_fecha_ingesta",
            "business_rules": [],
            "approved_quality_rules": [],
            "context": "Smoke test candidato Gemini ADK FinOps.",
            "requested_by": "cloud-build-finops-candidate"
        }
        status, _, body = request(
            "/silver-agents/table-profiler/run",
            method="POST",
            payload=profile_request,
            timeout=600,
        )
        result = json.loads(body)
        assert status == 200, body
        assert result["status"] == "COMPLETED", result
        profile = result.get("evidence")
        assert isinstance(profile, dict), {
            "message": "Agent response does not include canonical tool evidence",
            "response": result,
        }
        assert int(profile["row_count"]) > 0, profile
        assert profile.get("columns"), profile
        assert profile.get("table") == "proyectopersonal-480420.seguros_bronce.pagos_primas", profile
        column_names = {item["name"] for item in profile["columns"]}
        assert "producto_id" not in column_names, {
            "message": "The selected table profile leaked cat_producto seed columns",
            "columns": sorted(column_names),
        }

        mapping_request = dict(profile_request)
        mapping_request["columns"] = [
            {"name": item["name"], "type": item["type"], "mode": item.get("mode", "NULLABLE")}
            for item in profile["columns"]
        ]
        mapping_errors = []
        for attempt in range(1, 4):
            try:
                status, _, body = request(
                    "/silver-agents/mapping-advisor/run",
                    method="POST",
                    payload=mapping_request,
                    timeout=600,
                )
                if status == 200:
                    break
                mapping_errors.append(f"attempt={attempt} status={status} body={body}")
            except urllib.error.HTTPError as exc:
                error_body = exc.read().decode(errors="replace")
                mapping_errors.append(f"attempt={attempt} status={exc.code} body={error_body}")
            if attempt < 3:
                time.sleep(5 * attempt)
        else:
            raise AssertionError({"message": "Mapping advisor failed after three attempts", "errors": mapping_errors})

        mapping_result = json.loads(body)
        assert status == 200, {"body": body, "errors": mapping_errors}
        mapping_evidence = mapping_result.get("evidence") or {}
        mapped_sources = {item["source_column"] for item in mapping_evidence.get("columns", [])}
        assert mapped_sources == column_names, {"expected": sorted(column_names), "actual": sorted(mapped_sources)}
        assert "producto_id" not in mapped_sources

        report_req = urllib.request.Request(
            base + "/silver-agents/table-profiler/report",
            data=json.dumps(profile_request).encode(),
            method="POST",
            headers={"Content-Type": "application/json"},
        )
        with urllib.request.urlopen(report_req, timeout=600) as response:
            pdf = response.read()
            assert response.status == 200
            assert response.headers.get_content_type() == "application/pdf"
            assert pdf.startswith(b"%PDF-")
            assert len(pdf) > 1500

        status, _, body = request("/agentops/finops/summary?days=30")
        finops_summary = json.loads(body)
        assert status == 200, body
        assert int(finops_summary["llm_calls"]) > 0, finops_summary
        assert int(finops_summary["total_tokens"]) > 0, finops_summary
        billing_available = finops_summary["billing_cost_available"] is True
        billing_source_available = finops_summary.get("billing_source_available") is True
        if billing_available:
            assert billing_source_available, finops_summary
            assert finops_summary["billing_data_in_period"] is True, finops_summary
            assert finops_summary["cost_usd"] is not None, finops_summary
            assert finops_summary["cost_semantics"] == "FACTURADO", finops_summary
            assert finops_summary["cost_source"] == "CLOUD_BILLING_DETAILED_USAGE_EXPORT", finops_summary
            assert finops_summary.get("billing_currency"), finops_summary
        else:
            assert finops_summary["cost_usd"] is None, finops_summary
            assert finops_summary["cost_semantics"] == "NO_DISPONIBLE", finops_summary
            assert finops_summary["cost_source"] in {
                "CLOUD_BILLING_EXPORT_PENDING",
                "CLOUD_BILLING_EXPORT_NOT_YET_COVERING_PERIOD",
            }, finops_summary
            if billing_source_available:
                assert finops_summary["billing_table"], finops_summary
                assert finops_summary["billing_data_in_period"] is False, finops_summary
                assert finops_summary["last_usage_at"] is not None, finops_summary

        status, _, body = request("/agentops/finops/daily?days=30")
        finops_daily = json.loads(body)
        assert status == 200, body
        assert isinstance(finops_daily["series"], list) and finops_daily["series"], finops_daily
        assert "cost_usd" not in finops_daily, finops_daily

        status, _, body = request("/agentops/finops/agents?days=30")
        finops_agents = json.loads(body)
        assert status == 200, body
        assert finops_agents["cost_semantics"] == "ATRIBUCION_PENDIENTE", finops_agents
        assert finops_agents["cost_usd"] is None, finops_agents
        observed_agents = {item["agent_name"] for item in finops_agents["agents"]}
        assert {"table-profiler", "mapping-advisor"}.issubset(observed_agents), finops_agents

        status, _, body = request("/agentops/finops/runs?days=30&limit=20")
        finops_runs = json.loads(body)
        assert status == 200, body
        assert finops_runs["cost_semantics"] == "ATRIBUCION_PENDIENTE", finops_runs
        assert finops_runs["cost_usd"] is None, finops_runs
        assert isinstance(finops_runs["runs"], list) and finops_runs["runs"], finops_runs
        assert all(item.get("run_id") for item in finops_runs["runs"]), finops_runs

        status, _, body = request("/agentops/finops/services?days=30")
        finops_services = json.loads(body)
        assert status == 200, body
        assert finops_services["billing_cost_available"] is billing_available, finops_services
        assert finops_services.get("billing_source_available") is billing_source_available, finops_services
        if billing_available:
            assert finops_services["cost_semantics"] == "FACTURADO", finops_services
            assert finops_services["cost_usd"] is not None, finops_services
            assert finops_services["billing_table"], finops_services
            assert finops_services.get("billing_currency"), finops_services
        else:
            assert finops_services["cost_semantics"] == "NO_DISPONIBLE", finops_services
            assert finops_services["cost_usd"] is None, finops_services
            assert finops_services["services"] == [], finops_services

        print(json.dumps({
            "health": health,
            "agents": [item["name"] for item in agents],
            "profile_table": profile.get("table"),
            "profile_rows": profile.get("row_count"),
            "session_id": result.get("session_id"),
            "profile_pdf_bytes": len(pdf),
            "mapping_columns": len(mapped_sources),
            "seed_leak": False,
            "finops_candidate": True,
            "finops_llm_calls": finops_summary["llm_calls"],
            "finops_total_tokens": finops_summary["total_tokens"],
            "finops_agents": sorted(observed_agents),
            "billing_source_available": billing_source_available,
            "billing_cost_available": billing_available,
            "billing_cost_usd": finops_summary["cost_usd"],
            "billing_currency": finops_summary.get("billing_currency"),
            "billing_cost_semantics": finops_summary["cost_semantics"],
            "billing_cost_source": finops_summary["cost_source"],
            "billing_last_usage_at": str(finops_summary.get("last_usage_at")),
        }, ensure_ascii=False))

images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_IMAGE_NAME}:agents-8.2.0-${BUILD_ID}

options:
  logging: CLOUD_LOGGING_ONLY

timeout: 2400s
