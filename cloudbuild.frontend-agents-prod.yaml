substitutions:
  _REGION: us-central1
  _REPOSITORY: dataops
  _IMAGE_NAME: business-rules-silver-ui
  _IMAGE_TAG: agents-prod-manual
  _BACKEND_URL: https://silver-refinement-agent-mkqutd4koq-uc.a.run.app

steps:
  - id: frontend-build-check
    name: node:22-slim
    entrypoint: bash
    args:
      - -ceu
      - |
        npm ci
        npm run build

  - id: build-frontend-production
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - Dockerfile.frontend
      - --build-arg
      - VITE_SILVER_API_URL=${_BACKEND_URL}
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_IMAGE_NAME}:${_IMAGE_TAG}
      - .

  - id: push-frontend-production
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_IMAGE_NAME}:${_IMAGE_TAG}

images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_IMAGE_NAME}:${_IMAGE_TAG}

options:
  logging: CLOUD_LOGGING_ONLY

timeout: 1800s
