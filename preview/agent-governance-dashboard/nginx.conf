server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_ssl_server_name on;
    proxy_set_header Host atlas-datagob-api-f56-preview-mkqutd4koq-uc.a.run.app;
    proxy_set_header X-ATLAS-USER feature56.preview@atlas.local;
    proxy_set_header X-ATLAS-ROLES "data_steward,data_architect,executive";
    proxy_set_header Accept application/json;
    proxy_pass https://atlas-datagob-api-f56-preview-mkqutd4koq-uc.a.run.app/;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  add_header Cache-Control "no-store" always;
  add_header X-Content-Type-Options "nosniff" always;
}
