substitutions:
  _REGION: us-central1
  _SERVICE: silver-refinement-agent-merge-test
  _REPOSITORY: dataops
  _IMAGE_NAME: silver-refinement-agent

steps:
  - id: backend-tests
    name: python:3.11-slim
    dir: backend/deployable/silver-refinement-agent
    entrypoint: bash
    args:
      - -ceu
      - |
        python -m pip install --no-cache-dir -r requirements-test.txt
        python -m compileall -q modules tests
        python -m pytest -q \
          tests/test_silver_agents.py \
          tests/test_result_validator.py

  - id: build-candidate
    name: gcr.io/cloud-builders/docker
    dir: backend/deployable/silver-refinement-agent
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_IMAGE_NAME}:agents-8.2.0-${BUILD_ID}
      - .

  - id: push-candidate
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_IMAGE_NAME}:agents-8.2.0-${BUILD_ID}

  - id: deploy-test-service
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --project=${PROJECT_ID}
      - --region=${_REGION}
      - --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_IMAGE_NAME}:agents-8.2.0-${BUILD_ID}
      - --platform=managed
      - --quiet

  - id: smoke-health-cors-agents
    name: python:3.11-slim
    entrypoint: python
    args:
      - -c
      - |
        import json
        import re
        import urllib.request

        base = "https://silver-refinement-agent-merge-test-mkqutd4koq-uc.a.run.app"

        def request(path, method="GET", payload=None, headers=None, timeout=300):
            body = None if payload is None else json.dumps(payload).encode()
            req = urllib.request.Request(
                base + path,
                data=body,
                method=method,
                headers={"Content-Type": "application/json", **(headers or {})},
            )
            with urllib.request.urlopen(req, timeout=timeout) as response:
                return response.status, dict(response.headers), response.read().decode()

        status, _, body = request("/health")
        health = json.loads(body)
        assert status == 200, body
        assert health["status"] == "ok", health
        assert health["version"] == "8.2.0", health

        status, headers, _ = request(
            "/silver-agents",
            method="OPTIONS",
            headers={
                "Origin": "https://business-rules-silver-ui-mkqutd4koq-uc.a.run.app",
                "Access-Control-Request-Method": "GET",
            },
        )
        assert status == 200, status
        assert headers.get("access-control-allow-origin") == "*", headers

        status, _, body = request("/silver-agents")
        agents = json.loads(body)
        assert status == 200, body
        assert {item["name"] for item in agents} == {
            "table-profiler",
            "quality-rule-advisor",
            "business-rule-validator",
            "notebook-generator",
            "orchestrator",
        }, agents

        profile_request = {
            "project_id": "proyectopersonal-480420",
            "source_dataset": "seguros_bronce",
            "source_table": "cat_producto",
            "target_project_id": "proyectopersonal-480420",
            "target_dataset": "seguros_silver",
            "target_table": "cat_producto",
            "columns": [],
            "load_strategy": {
                "type": "MERGE",
                "business_keys": ["producto_id"],
                "watermark_column": "bronze_fecha_ingesta",
            },
            "physical_design": {},
            "business_keys": ["producto_id"],
            "watermark_column": "bronze_fecha_ingesta",
            "business_rules": [],
            "approved_quality_rules": [],
            "context": "Smoke test candidato Gemini ADK.",
        }
        status, _, body = request(
            "/silver-agents/table-profiler/run",
            method="POST",
            payload=profile_request,
            timeout=600,
        )
        result = json.loads(body)
        assert status == 200, body
        assert result["status"] == "COMPLETED", result
        raw_output = result["output"].strip()
        raw_output = re.sub(r"^```(?:json)?\\s*", "", raw_output, flags=re.I)
        raw_output = re.sub(r"\\s*```$", "", raw_output)
        profile = json.loads(raw_output)
        assert int(profile["row_count"]) > 0, profile
        assert profile.get("columns"), profile

        print(json.dumps({
            "health": health,
            "agents": [item["name"] for item in agents],
            "profile_table": profile.get("table"),
            "profile_rows": profile.get("row_count"),
            "session_id": result.get("session_id"),
        }, ensure_ascii=False))

images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_IMAGE_NAME}:agents-8.2.0-${BUILD_ID}

options:
  logging: CLOUD_LOGGING_ONLY

timeout: 2400s
